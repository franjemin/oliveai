services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: olive
      POSTGRES_PASSWORD: olive
      POSTGRES_DB: olive
    ports:
      - "5432:5432"
    volumes:
      - olive_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olive -d olive"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: olive
      MINIO_ROOT_PASSWORD: oliveolive
      MINIO_REGION_NAME: ca-central-1
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - olive_minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 olive oliveolive;
      mc mb --ignore-existing local/olive-audio;
      exit 0;
      "

volumes:
  olive_pg:
  olive_minio:
