services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: olive
      POSTGRES_PASSWORD: olive
      POSTGRES_DB: olive
    ports:
      - "5432:5432"
    volumes:
      # Wave A at-rest: use an encrypted disk/volume in any shared or prod host.
      # Local compose is plaintext on the developer machine.
      - olive_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olive -d olive"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: olive
      MINIO_ROOT_PASSWORD: oliveolive
      MINIO_REGION_NAME: ca-central-1
      # Wave A at-rest equivalent (local key). Wave B (OLI-14) replaces this with CMEK/KMS.
      MINIO_KMS_SECRET_KEY: "olive-demo:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      # Shared/prod: place this volume on encrypted disk. App also AES-GCM-seals audio before put.
      - olive_minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 olive oliveolive;
      mc mb --ignore-existing local/olive-audio;
      mc encrypt set sse-s3 local/olive-audio;
      exit 0;
      "

volumes:
  olive_pg:
  olive_minio:
